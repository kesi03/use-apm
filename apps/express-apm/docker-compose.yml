version: "3.9"

services:
  express-apm:
    image: mockholm/use-apm-express
    build:
      context: ./express-apm
      dockerfile: Dockerfile.express
    environment:
      ELASTIC_APM_SERVICE_NAME: express-apm
      ELASTIC_APM_SERVER_URL: ${APM_SERVER}
      ELASTIC_APM_ENVIRONMENT: development
      ELASTIC_APM_SECRET_TOKEN: ${APM_SECRET_TOKEN}
      ELASTIC_APM_API_KEY: ${APM_API_KEY}
    ports:
      - "3000:3000"
