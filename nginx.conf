worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Allow React client to call the proxy
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization";

    # Read environment variables
    env APM_SERVER;
    env APM_TOKEN;
    env EXPRESS_SERVER;

    # Map env vars into nginx variables
    map $APM_SERVER $apm_server {
        default $APM_SERVER;
    }

    map $APM_TOKEN $apm_token {
        default $APM_TOKEN;
    }

    map $EXPRESS_SERVER $express_server {
        default $EXPRESS_SERVER;
    }

    server {
        listen 80;

        # Health check
        location /health {
            return 200 "OK\n";
        }

        location /express {
            proxy_pass $express_server; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Content-Type "application/json";

            client_max_body_size 10m;

            proxy_request_buffering off;
            proxy_buffering off;
        }


        # Proxy for Elastic APM intake
        location /apm {
            proxy_pass $apm_server;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Inject APM token
            proxy_set_header Authorization "Bearer $apm_token";

            # NDJSON support
            proxy_set_header Content-Type "application/x-ndjson";

            # Allow large payloads
            client_max_body_size 10m;

            # Keep NDJSON streaming intact
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
